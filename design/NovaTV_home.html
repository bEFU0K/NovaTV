<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova TV — главный экран</title>
<style>
  :root{--glass:rgba(18,28,54,.70);--hi:rgba(43,63,107,.92);--text:#f2f5fb;--dim:#a9b6ce;--accent:#3d8bff;--ok:#14d8c4}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#000}
  body{display:grid;place-items:center;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
  svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .a{stroke:var(--accent)} .af{fill:var(--accent);stroke:none}
  .stage{container-type:inline-size;width:min(100vw,177.78vh);aspect-ratio:16/9;position:relative;overflow:hidden;
    background:radial-gradient(120% 140% at 0% 0%,#0b4cb0 0%,#0a2f6b 22%,#0a1a3a 48%,#070d1c 72%,#060912 100%)}
  .glow{position:absolute;inset:0;background:radial-gradient(40cqw 40cqw at 12cqw 8cqw,rgba(61,139,255,.16),transparent 70%)}
    .main{position:absolute;inset:0;padding:4cqw 5cqw 3cqw;display:flex;flex-direction:column;}
    header{display:flex;justify-content:space-between;align-items:flex-start}
  .clock{font-size:6.4cqw;font-weight:300;letter-spacing:-.02em;line-height:1}
  .date{font-size:1.5cqw;color:var(--dim);margin-top:.7cqw}
  .right{display:flex;gap:.9cqw;align-items:center}
  .chip{background:var(--glass);border-radius:5cqw;padding:.6cqw 1.3cqw;font-size:1.3cqw;display:flex;gap:.6cqw;align-items:center}
  .dot{width:.7cqw;height:.7cqw;border-radius:50%;background:var(--ok)}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .focusable{border:.15cqw solid transparent;transition:transform .12s,background .12s}
  .focusable:hover,.focusable:focus-visible,.focusable.on{background:var(--hi)!important;border-color:var(--accent);transform:scale(1.04);outline:none}
  .burger{width:4.2cqw;height:4.2cqw;border-radius:1.2cqw;background:var(--glass);display:grid;place-items:center}
  .burger svg{width:2.3cqw;height:2.3cqw}
  h1{font-size:2.1cqw;font-weight:600;margin:3.4cqw 0 1.2cqw}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2cqw}
  .tile{background:var(--glass);border-radius:1.4cqw;padding:1.5cqw 1.7cqw;height:11cqw;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
  .ico{width:4cqw;height:4cqw;border-radius:1.1cqw;background:rgba(61,139,255,.2);display:grid;place-items:center;}
  .tile:hover .ico,.tile.on .ico{background:rgba(61,139,255,.42)}
  .ico svg{width:2.4cqw;height:2.4cqw}
  .tile b{display:block;font-size:1.7cqw;font-weight:600}
  .tile span{display:block;font-size:1.15cqw;color:var(--dim);margin-top:.25cqw}
  footer{margin-top:auto;display:flex;justify-content:space-between;font-size:1.2cqw;color:var(--dim)}
  .scrim{position:absolute;inset:0;background:rgba(3,8,18,.55);opacity:0;pointer-events:none;transition:opacity .25s}
  .stage.open .scrim{opacity:1;pointer-events:auto}
  .panel{position:absolute;top:0;right:0;bottom:0;width:27cqw;padding:2cqw 1.6cqw;display:flex;flex-direction:column;gap:.7cqw;
    background:linear-gradient(#122244f2,#0a1226f2);border-radius:2cqw 0 0 2cqw;will-change:transform;
    transform:translateX(105%);transition:transform .28s ease-out}
  .stage.open .panel{transform:none}
  .row{display:flex;align-items:center;gap:1cqw;padding:.8cqw 1cqw;border-radius:1.1cqw;background:transparent;width:100%;text-align:left}
  .row svg{width:2cqw;height:2cqw;flex:none}
  .row b{display:block;font-size:1.35cqw;font-weight:600}
  .row span{display:block;font-size:.9cqw;color:var(--dim)}
  .acc{background:rgba(255,255,255,.06);border-radius:1.4cqw;padding:1cqw;margin-bottom:.8cqw}
  .ava{width:3.6cqw;height:3.6cqw;border-radius:50%;background:linear-gradient(135deg,#3d8bff,#8b5cf6);display:grid;place-items:center;font-weight:600;font-size:1.6cqw;flex:none}
  .acc b{font-size:1.5cqw}
  .toast{position:absolute;left:50%;bottom:5cqw;transform:translate(-50%,2cqw);background:var(--hi);padding:.8cqw 2cqw;border-radius:5cqw;font-size:1.4cqw;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){.glow{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 18h16"/><path class="a" d="M4 12h11"/></symbol>
  <symbol id="apps" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2" class="a"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
  <symbol id="files" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/><path class="a" d="M7 13h10"/></symbol>
  <symbol id="install" viewBox="0 0 24 24"><path class="a" d="M12 4v10M8 10l4 4 4-4"/><path d="M5 15v4h14v-4"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle class="af" cx="12" cy="15.5" r="1.2"/></symbol>
  <symbol id="update" viewBox="0 0 24 24"><path d="M17.4 7.5A7 7 0 1 0 19 12"/><path class="a" d="M18 3.5V8h-4.5"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle class="af" cx="12" cy="12" r="2.2"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></symbol>
  <symbol id="volume" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="a" d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></symbol>
  <symbol id="wifi" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0"/><path class="a" d="M8.7 15.8a5 5 0 0 1 6.6 0"/><circle class="af" cx="12" cy="19" r="1.3"/></symbol>
  <symbol id="bt" viewBox="0 0 24 24"><path d="M7 8l10 8-5 5V3l5 5L7 16"/><circle class="af" cx="12" cy="12" r="1"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6l-7 9-7-9V6z"/><path class="a" d="M9 12l2 2 4-4"/></symbol>
  <symbol id="kbd" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M8 14.5h8"/><g class="af"><circle cx="7" cy="10" r=".9"/><circle cx="10" cy="10" r=".9"/><circle cx="14" cy="10" r=".9"/><circle cx="17" cy="10" r=".9"/></g></symbol>
  <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle class="af" cx="12" cy="8" r="1"/><path d="M12 11v5"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle class="a" cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
</defs></svg>

<div class="stage" id="stage">
  <div class="glow"></div>
  <div class="main">
    <header>
      <div><div class="clock" id="clock">20:45</div><div class="date" id="date"></div></div>
      <div class="right">
        <div class="chip"><i class="dot"></i>Wi-Fi</div>
        <div class="chip">VPN выключен</div>
        <button class="burger focusable" id="burger" aria-label="Меню"><svg><use href="#menu"/></svg></button>
      </div>
    </header>
    <h1>Главная</h1>
    <div class="grid" id="grid">
      <button class="tile focusable"><div class="ico"><svg><use href="#apps"/></svg></div><div><b>Все приложения</b><span>Запуск, избранное</span></div></button>
      <button class="tile focusable"><div class="ico"><svg><use href="#files"/></svg></div><div><b>Файлы</b><span>Память, USB</span></div></button>
      <button class="tile focusable"><div class="ico"><svg><use href="#lock"/></svg></div><div><b>Системные</b><span>Установлены</span></div></button>
    </div>
    <footer><div>Стрелки — выбор · OK — открыть · Назад — закрыть меню</div><div>Nova TV OS 1.0</div></footer>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-label="Меню">
    <button class="acc row focusable" style="width:100%"><div class="ava">Н</div><div><b>Ваш аккаунт</b><span>Srepportal · управление входом</span></div></button>
    <button class="row focusable"><svg><use href="#volume"/></svg><div><b>Громкость</b><span>60%</span></div></button>
    <button class="row focusable"><svg><use href="#wifi"/></svg><div><b>Интернет</b><span>Wi-Fi</span></div></button>
    <button class="row focusable"><svg><use href="#bt"/></svg><div><b>Bluetooth</b><span>Пульты, наушники</span></div></button>
    <button class="row focusable"><svg><use href="#shield"/></svg><div><b>VPN</b><span>Выключен</span></div></button>
    <button class="row focusable"><svg><use href="#kbd"/></svg><div><b>Клавиатура</b><span>Экранная RU / EN</span></div></button>
    <button class="row focusable"><svg><use href="#info"/></svg><div><b>Об устройстве</b><span>CPU, ОЗУ, память</span></div></button>
    <button class="row focusable"><svg><use href="#gear"/></svg><div><b>Все настройки</b></div></button>
  </aside>
  <div class="toast" id="toast"></div>
</div>

<script>
  const stage=document.getElementById('stage'), burger=document.getElementById('burger');
  const tiles=[...document.querySelectorAll('.tile')], rows=[...document.querySelectorAll('.panel .row')];
  const toast=document.getElementById('toast'); let tt, cur=0, rc=0;
  const isOpen=()=>stage.classList.contains('open');
  function mark(list,i){ list.forEach(t=>t.classList.remove('on')); list[i].classList.add('on'); list[i].focus({preventScroll:true}); }
  function say(el){ toast.textContent='Открывается: '+el.querySelector('b').textContent; toast.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>toast.classList.remove('show'),1400); }
  function setOpen(v){ stage.classList.toggle('open',v); if(v){rc=0;mark(rows,0)} else {burger.focus()} }
  burger.addEventListener('click',()=>setOpen(!isOpen()));
  document.getElementById('scrim').addEventListener('click',()=>setOpen(false));
  tiles.forEach((t,i)=>{t.addEventListener('mouseenter',()=>{cur=i;mark(tiles,i)});t.addEventListener('click',()=>say(t))});
  rows.forEach((r,i)=>{r.addEventListener('mouseenter',()=>{rc=i;mark(rows,i)});r.addEventListener('click',()=>{say(r.querySelector('b')?r:r);setOpen(false)})});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'||e.key==='Backspace'){ if(isOpen()){e.preventDefault();setOpen(false)} return; }
    if(isOpen()){
      const d={ArrowDown:1,ArrowUp:-1}[e.key]; if(d){e.preventDefault();rc=Math.max(0,Math.min(rows.length-1,rc+d));mark(rows,rc)}
      else if(e.key==='Enter'){say(rows[rc]);setOpen(false)} return;
    }
    const d={ArrowRight:1,ArrowLeft:-1,ArrowDown:3,ArrowUp:-3}[e.key];
    if(d){e.preventDefault();
      if(e.key==='ArrowUp'&&cur<3){burger.classList.add('on');burger.focus();return}
      burger.classList.remove('on'); cur=Math.max(0,Math.min(tiles.length-1,cur+d)); mark(tiles,cur)}
    else if(e.key==='Enter'){ if(document.activeElement===burger) setOpen(true); else say(tiles[cur]) }
  });
  function tick(){const n=new Date();
    document.getElementById('clock').textContent=n.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('date').textContent=n.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}
  tick(); setInterval(tick,10000); mark(tiles,0);
</script>
</body>
</html>
